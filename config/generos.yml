# ============================================================
# DJ Zezé — Mapa de Gêneros
# ============================================================
# Define os gêneros da biblioteca, seus aliases (sinônimos
# encontrados em tags ID3) e artistas de referência.
#
# Regras:
# - "Pagode" → Samba (variação de samba)
# - "Pagode Baiano" / "Pagodão" → Pagodão (ritmo baiano)
# - Aliases são case-insensitive na hora da comparação
# ============================================================

